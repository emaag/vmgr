name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        # Stock macOS bash is 3.2; the scripts need bash 4+ (associative arrays)
        brew install bash jq coreutils
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Run test suite
      run: bash tests/run_tests.sh

    - name: Test version and help
      run: |
        ./video-manager-ultimate.sh --version
        ./video-manager-ultimate.sh --help

    - name: Test dry-run mode leaves files untouched
      run: |
        dir="$(mktemp -d)"
        touch "$dir/foo - bar.mp4"
        ./video-manager-ultimate.sh --dry-run rename "$dir"
        ./video-manager-ultimate.sh --dry-run cleanup "$dir"
        test -f "$dir/foo - bar.mp4"
        rm -rf "$dir"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run ShellCheck (errors fail the build)
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        shellcheck -x -S error video-manager-ultimate.sh install.sh lib/*.sh tests/*.sh tests/*/*.sh vmgr-completion.bash
